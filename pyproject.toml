[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runningwhale"
version = "0.1.0"
description = "Coach de running personnel : synchronise Garmin Connect et produit des analyses et des plans avec Claude"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.2.20",
    "anthropic>=0.60",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
workout = ["pydantic>=2.0"]
fit = ["fitparse>=1.2"]  # import des fichiers .fit d'origine de la montre
dev = ["pytest>=8.0", "mcp>=2.0", "pydantic>=2.0", "fitparse>=1.2"]

[project.scripts]
coach = "runningwhale.cli:main"
coach-mcp = "runningwhale.mcp_server:main"

[tool.setuptools.packages.find]
include = ["runningwhale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
